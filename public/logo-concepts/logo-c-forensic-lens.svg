<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep pure black background -->
  <rect width="1024" height="1024" fill="#0a0a0a" />

  <!-- LOGO C: "FORENSIC LENS" — Optical camera lens & forensic targeting V -->
  <!-- Emerald #10b981, 22px stroke, rounded ends -->
  <g id="forensic-lens-emblem" stroke="#10b981" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Primary Concentric Letter V (Brand core matching Logo A & Logo B) -->
    <!-- Outer V -->
    <polyline points="280,180 512,660 744,180" stroke-width="26" fill="none" />
    <!-- Inner V -->
    <polyline points="354,180 512,508 670,180" stroke-width="18" fill="none" />

    <!-- FORENSIC OPTICAL LENS (Centered in the upper focal zone of the V) -->
    <!-- Outer Lens Ring (Aperture Barrel) -->
    <circle cx="512" cy="350" r="140" stroke-width="20" fill="none" />

    <!-- Inner Aperture Iris -->
    <circle cx="512" cy="350" r="76" stroke-width="14" fill="#0a0a0a" />

    <!-- Central Focal Point (Forensic Target) -->
    <circle cx="512" cy="350" r="14" fill="#10b981" stroke="none" />

    <!-- Optical Crosshair Axes (Precision Reticle Ticks) -->
    <!-- Top tick -->
    <line x1="512" y1="160" x2="512" y2="230" stroke-width="14" />
    <!-- Bottom tick -->
    <line x1="512" y1="470" x2="512" y2="540" stroke-width="14" />
    <!-- Left tick -->
    <line x1="322" y1="350" x2="392" y2="350" stroke-width="14" />
    <!-- Right tick -->
    <line x1="632" y1="350" x2="702" y2="350" stroke-width="14" />

    <!-- Inner Reticle Sub-Ticks (Forensic calibration marks) -->
    <line x1="512" y1="285" x2="512" y2="305" stroke-width="6" />
    <line x1="512" y1="395" x2="512" y2="415" stroke-width="6" />
    <line x1="447" y1="350" x2="467" y2="350" stroke-width="6" />
    <line x1="557" y1="350" x2="577" y2="350" stroke-width="6" />
  </g>

  <!-- TYPOGRAPHY: VERDEX WORDMARK (Pixel-perfect match with Logo B) -->
  <text x="512" y="810" 
        font-family="'Archivo', 'Arial Black', sans-serif" 
        font-size="78" 
        font-weight="800" 
        letter-spacing="0.14em" 
        fill="#10b981" 
        text-anchor="middle">VERDEX</text>
</svg>
